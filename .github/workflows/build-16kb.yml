name: build-16kb-native

# Best-effort scaffold to rebuild ijkplayer's native .so with 16 KB page-size
# alignment (Android 15 / API 35 requirement). The ijkplayer native build is
# finicky with modern NDKs — expect to iterate on the patch/compile steps.
# Run manually via the "Run workflow" button.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm make git wget pkg-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Modern NDK: the fork's do-compile-ffmpeg.sh now uses the unified clang
      # toolchain (no standalone toolchain), so r27c works and gives 16 KB
      # alignment (arm64/x86_64 by default + explicit flag in the script).
      - name: Set up NDK r27c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK env for ijkplayer scripts
        run: |
          echo "ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK=${{ steps.ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # Cache the built FFmpeg (contrib/build/output-<arch>) so JNI-only
      # iterations skip the ~8 min FFmpeg cross-compile. Key changes whenever the
      # FFmpeg build scripts change.
      - name: Cache FFmpeg output
        id: ffcache
        uses: actions/cache@v4
        with:
          path: android/contrib/build/output-*
          key: ffmpeg-16kb-r27c-${{ hashFiles('android/contrib/tools/do-compile-ffmpeg.sh', 'android/contrib/tools/do-detect-env.sh', 'android/contrib/compile-ffmpeg.sh') }}

      - name: Fetch FFmpeg sources
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          # init-android.sh lives at the repo root and clones FFmpeg into
          # android/contrib/ffmpeg-<arch> for each ABI.
          ./init-android.sh

      # Patch the JNI ndk-build config for modern NDK (r27) + 16 KB alignment.
      - name: Patch ndk-build config (STL + 16 KB link flags)
        run: |
          FLAGS='-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'
          for mk in $(find android/ijkplayer -name 'Application.mk'); do
            echo "patching $mk"
            # Removed STLs in modern NDK → the only supported static STL is c++_static.
            sed -i -E 's/APP_STL\s*:=\s*(stlport_static|gnustl_static|gnustl_shared|stlport_shared)/APP_STL := c++_static/' "$mk"
            # android-9 / low APP_PLATFORM: r27 min is 21.
            sed -i -E 's/APP_PLATFORM\s*:=\s*android-[0-9]+/APP_PLATFORM := android-21/' "$mk"
            # 16 KB alignment on the final .so link.
            grep -q 'max-page-size=16384' "$mk" || \
              printf "\nAPP_LDFLAGS += %s\n" "$FLAGS" >> "$mk"
            echo "--- $mk ---"; grep -E 'APP_STL|APP_PLATFORM|APP_ABI|APP_LDFLAGS' "$mk"
          done

      - name: Debug — test unified clang link
        run: |
          TC="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "wrapper:"; ls -la "$TC/bin/aarch64-linux-android21-clang" || echo "MISSING"
          echo 'int main(){return 0;}' > /tmp/t.c
          echo "--- direct ---"
          "$TC/bin/aarch64-linux-android21-clang" -Wl,-z,max-page-size=16384 -o /tmp/t /tmp/t.c \
            && echo "DIRECT OK" || echo "DIRECT FAIL"
          echo "--- via symlink + ijk flags ---"
          ln -sf "$TC/bin/aarch64-linux-android21-clang" /tmp/aarch64-linux-android-clang
          /tmp/aarch64-linux-android-clang -O3 -std=c99 -fPIE -fPIC -ffast-math \
            -Wa,--noexecstack -Wl,-z,max-page-size=16384 -o /tmp/t2 /tmp/t.c 2>&1 | tail -25
          test -f /tmp/t2 && echo "SYMLINK OK" || echo "SYMLINK FAIL"

      - name: Compile FFmpeg (all ABIs)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          cd android/contrib
          ./compile-ffmpeg.sh clean
          ./compile-ffmpeg.sh all || {
            echo "::group::FFmpeg config.log (link error detail)"
            for l in $(find . -name config.log 2>/dev/null); do
              echo "### $l"; head -80 "$l"
            done
            echo "::endgroup::"
            exit 1
          }

      # The JNI Android.mk reads FFmpeg from contrib/build/ffmpeg-<arch>/output,
      # but the modernized do-compile-ffmpeg.sh installs to contrib/build/output-<arch>.
      # Bridge the two layouts with symlinks so PREBUILT_SHARED_LIBRARY resolves.
      - name: Bridge FFmpeg output layout for ndk-build
        run: |
          cd android/contrib/build
          for a in armv7a arm64 x86 x86_64; do
            [ -d "output-$a" ] || { echo "missing output-$a"; exit 1; }
            mkdir -p "ffmpeg-$a"
            ln -sfn "$(realpath output-$a)" "ffmpeg-$a/output"
            echo "ffmpeg-$a/output -> $(readlink ffmpeg-$a/output)"
            ls "ffmpeg-$a/output/libijkffmpeg.so" "ffmpeg-$a/output/include" >/dev/null \
              && echo "  ok: .so + include present" || { echo "  !! missing .so or include"; ls -la "ffmpeg-$a/output"; exit 1; }
          done

      - name: Compile ijkplayer JNI (.so via ndk-build)
        run: |
          cd android
          # 'all' includes armv5 (unsupported on modern NDK) — build the 4 real ABIs.
          for a in armv7a arm64 x86 x86_64; do
            echo "::group::ndk-build $a"
            ./compile-ijk.sh "$a"
            echo "::endgroup::"
          done
          echo "=== produced .so ==="
          find . -name '*.so' | sort
          # compile-ijk.sh's `cd -` masks ndk-build failures (exits 0), so assert
          # the JNI libs actually exist for every ABI we asked for.
          missing=0
          for a in armeabi-v7a arm64-v8a x86 x86_64; do
            for lib in libijkplayer.so libijksdl.so; do
              if ! find ijkplayer -path "*/libs/$a/$lib" | grep -q .; then
                echo "::error::missing $a/$lib"; missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || { echo "JNI build did not produce all libs"; exit 1; }

      # Every LOAD segment must show Align 0x4000 (16384), not 0x1000 (4096).
      - name: Verify 16 KB alignment
        run: |
          READELF=$(find "$ANDROID_NDK_HOME" "$ANDROID_NDK_ROOT" -name 'llvm-readelf' 2>/dev/null | head -1)
          fail=0
          for so in $(find android -name '*.so'); do
            aligns=$("$READELF" -lW "$so" | awk '$1=="LOAD"{print $NF}')
            echo "$so -> $aligns"
            echo "$aligns" | grep -q '0x1000' && { echo "  !! 4KB LOAD segment"; fail=1; }
          done
          [ "$fail" -eq 0 ] || echo "::warning::some .so still have 4KB LOAD segments — adjust NDK/link flags"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ijkplayer-16kb
          if-no-files-found: warn
          path: |
            android/**/*.so
            android/**/*.aar

# After this produces 16 KB .so, assemble fijkplayer-full.aar in the
# chainzhang/fijkplayer fork (fijkplayer android lib + these .so as jniLibs),
# then drop it into the app at packages/fijkplayer/android/libs/fijkplayer-full.aar.
